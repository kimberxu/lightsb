name: Test

# Fork-only gate. Upstream's version of this file ran a 3 OS x 2 Go matrix of the
# full `go test ./...`, which never touched the `test/` module (separate module,
# not matched by `./...` from the repository root). This fork keeps a single
# ubuntu job that compiles everything and runs the fork regression test.

on:
  push:
    branches:
      - lightsb
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - lightsb
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false
      - name: Set build tags and ldflags
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Build all packages
        run: go build -v -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
      - name: Vet
        run: go vet -tags "$BUILD_TAGS" ./option/... ./route/...
      - name: Run fork regression test
        working-directory: test
        # -mod=mod is required: the checked-in test/go.mod is stale relative to
        # the root go.mod, so the default -mod=readonly refuses to proceed.
        run: |
          go test -mod=mod -v -count=1 \
            -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" \
            -run 'TestSniffOverrideDestination' .
